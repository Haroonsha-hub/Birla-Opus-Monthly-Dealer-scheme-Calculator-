<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Opus Dealer Scheme Calculator — Kollam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F7F9; --card:#FFFFFF;
    --ink:#14151A; --ink-soft:#6B7080;
    --line:#E7E9EF; --line-soft:#F0F1F5;
    --teal:#00A374; --teal-soft:#00A37414; --teal-dark:#00805B;
    --purple:#6351A3; --purple-soft:#6351A314;
    --gold:#F5A623; --gold-soft:#F5A62316;
    --orange:#F36A22; --orange-soft:#F36A2214; --orange-dark:#D9551A;
    --danger:#D5432E; --danger-soft:#D5432E12;
    --opus:#F36A22; --amber:#F5A623; --plum:#6351A3; --slate:#3D5568;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(20,21,26,.04), 0 1px 1px rgba(20,21,26,.03);
    --shadow-md:0 2px 8px rgba(20,21,26,.06), 0 1px 2px rgba(20,21,26,.04);
    --shadow-lg:0 12px 32px rgba(20,21,26,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14.5px;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  h1,h2,h3{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-.015em;}
  .wrap{max-width:600px;margin:0 auto;padding:0 18px;}

  /* ---------- Header ---------- */
  header.top{
    background:var(--card);
    box-shadow:var(--shadow-sm);
    position:relative;
    padding:18px 18px 0;
  }
  header.top::after{
    content:"";display:block;height:4px;margin-top:16px;
    background:linear-gradient(90deg, var(--teal) 0 25%, var(--gold) 25% 50%, var(--orange) 50% 75%, var(--purple) 75% 100%);
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;}
  .brand-logo{height:30px;width:auto;display:block;}
  .meta{
    margin-top:2px;font-size:11.5px;color:var(--ink-soft);
    font-weight:500;
  }
  .admin-btn{
    background:var(--line-soft);border:1px solid var(--line);color:var(--ink);
    font-size:11.5px;font-weight:600;cursor:pointer;
    padding:7px 14px;border-radius:20px;
  }
  .admin-btn:hover{background:var(--line);}

  .tabs{
    display:flex;gap:2px;margin:16px 0 0;background:var(--line-soft);
    border-radius:11px;padding:3px;
  }
  .tab{
    flex:1;background:none;border:none;padding:9px 4px;
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;font-family:'Inter';border-radius:9px;
    transition:all .15s ease;
  }
  .tab.active{color:var(--ink);background:var(--card);box-shadow:var(--shadow-sm);}

  main{padding-top:20px;}

  /* ---------- Inputs ---------- */
  .search{
    width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);font-size:14.5px;font-family:inherit;color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .search::placeholder{color:var(--ink-soft);}
  .search:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);}

  .cat-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin:24px 2px 10px;font-weight:700;
  }

  /* ---------- Product cards ---------- */
  .plist{display:flex;flex-direction:column;gap:10px;}
  .pcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .pcard.inbasket{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);}
  .ptop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .pname{font-weight:600;font-size:14px;line-height:1.3;color:var(--ink);}
  .pcat{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .pqty{display:flex;align-items:center;gap:8px;margin-top:11px;}
  .pqty input{
    width:76px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;
    text-align:right;background:var(--paper);color:var(--ink);
  }
  .pqty input:focus{outline:none;border-color:var(--teal);}
  .pqty .unit{font-size:11.5px;color:var(--ink-soft);font-weight:500;}
  .pmini{
    margin-left:auto;text-align:right;font-size:11px;color:var(--teal-dark);font-weight:700;
    line-height:1.4;font-family:'IBM Plex Mono',monospace;
  }
  .empty{padding:48px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* ---------- Sticky bar ---------- */
  .sticky-bar{
    position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);
    padding:14px 18px;z-index:30;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 -8px 24px rgba(0,0,0,.18);
  }
  .sticky-bar .sb-l{font-size:10px;color:#9BA0AE;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .sticky-bar .sb-v{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;color:#fff;margin-top:2px;}
  .sticky-bar button{
    background:var(--orange);color:#fff;border:none;border-radius:10px;
    padding:11px 18px;font-weight:700;font-size:12.5px;font-family:'Inter';
    box-shadow:0 2px 8px rgba(243,106,34,.35);
  }

  /* ---------- Overlay / sheets ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,15,20,.55);display:flex;align-items:flex-end;z-index:50;}
  .sheet{
    background:var(--paper);width:100%;max-height:90vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:22px 18px 34px;
    box-shadow:var(--shadow-lg);
  }
  .sheet h2{margin:0 0 4px;font-size:18px;}
  .sheet .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}

  /* ---------- Breakdown ledger rows ---------- */
  .breakdown-row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13px;
  }
  .breakdown-row .l{color:var(--ink-soft);}
  .breakdown-row .l b{color:var(--ink);display:block;font-size:12.5px;font-weight:600;}
  .breakdown-row .r{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);}

  .pill{
    display:inline-block;font-size:9px;font-weight:700;padding:3px 8px;
    border-radius:20px;margin-left:6px;letter-spacing:.03em;text-transform:uppercase;
  }
  .pill.open{background:var(--teal-soft);color:var(--teal-dark);}
  .pill.closed{background:var(--danger-soft);color:var(--danger);}

  /* ---------- Totals panel ---------- */
  .grand{
    background:var(--ink);color:#fff;border-radius:18px;padding:20px;margin-top:18px;
    box-shadow:var(--shadow-md);
  }
  .grand .row{
    display:flex;justify-content:space-between;font-size:12px;color:#9BA0AE;
    padding:5px 0;font-family:'IBM Plex Mono',monospace;
  }
  .grand .row b{color:#fff;font-weight:600;}
  .grand .final{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12);
  }
  .grand .final .l{font-size:12.5px;color:#9BA0AE;font-weight:600;font-family:'Inter';}
  .grand .final .v{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;color:#3DE0A8;}

  /* ---------- Line items (order summary) ---------- */
  .line-item{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  }
  .line-item .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;}
  .line-item .sub2{font-size:10.5px;color:var(--ink-soft);margin-top:6px;line-height:1.8;font-family:'IBM Plex Mono',monospace;}
  .line-item .sub2 span{display:inline-block;margin-right:12px;}
  .line-item .figs{
    display:flex;justify-content:space-between;margin-top:9px;padding-top:9px;
    border-top:1px dashed var(--line);font-size:11.5px;
  }
  .line-item .figs .lab{color:var(--ink-soft);}
  .line-item .figs b{font-family:'IBM Plex Mono',monospace;color:var(--teal-dark);font-weight:700;}

  /* ---------- Forms (admin) ---------- */
  .field{margin-bottom:13px;}
  .field label{
    display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft);
    margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;
  }
  .field input, .field select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
    font-size:13.5px;font-family:inherit;background:var(--card);color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);}
  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}
  .row3{display:flex;gap:7px;}
  .row3 > *{flex:1;}

  .btn{
    padding:10px 18px;border-radius:10px;border:1px solid transparent;
    font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter';
    transition:all .15s ease;
  }
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(243,106,34,.3);}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-danger{background:var(--danger-soft);border-color:transparent;color:var(--danger);}
  .btn-sm{padding:6px 12px;font-size:11px;border-radius:8px;}

  .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .status{font-size:11.5px;color:var(--teal-dark);font-weight:600;min-height:15px;font-family:'IBM Plex Mono',monospace;}

  .pinbox{text-align:center;padding:34px 10px;}
  .pinbox input{
    width:140px;text-align:center;font-size:22px;letter-spacing:9px;padding:12px;
    border-radius:12px;border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;
    box-shadow:var(--shadow-sm);
  }

  .admin-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .admin-block summary{cursor:pointer;font-weight:600;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;}

  .slabrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .slabrow input,.slabrow select{
    padding:7px 8px;font-size:11.5px;border:1px solid var(--line);border-radius:8px;
    font-family:'IBM Plex Mono',monospace;background:var(--paper);color:var(--ink);
  }
  .slabrow input.w{width:100%;}
  .stitle{font-size:10px;font-weight:700;color:var(--ink-soft);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em;}

  footer.note{margin-top:32px;font-size:10.5px;color:var(--ink-soft);text-align:center;padding:0 6px;line-height:1.6;}
  .note-box{
    background:var(--gold-soft);border:1px solid #F5A62330;border-radius:12px;
    padding:12px 14px;font-size:11.5px;color:#8A6412;margin:14px 0;line-height:1.6;
  }

  /* ---------- Product images / picker ---------- */
  .qp-icon{
    width:52px;height:52px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;font-size:18px;box-shadow:var(--shadow-sm);
  }
  .qp-icon img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
  .qp-row{
    display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;cursor:pointer;margin-bottom:9px;box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease;
  }
  .qp-row:hover{box-shadow:var(--shadow-md);}
  .qp-row .nm{font-weight:600;font-size:13.5px;color:var(--ink);}
  .qp-row .tg{font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-family:'IBM Plex Mono',monospace;}
  .qp-detail-head{display:flex;gap:16px;align-items:center;padding:4px 0 14px;}

  .warranty-badge{
    display:inline-block;background:var(--orange-soft);color:var(--orange-dark);font-size:10.5px;font-weight:700;
    padding:4px 11px;margin-top:6px;border-radius:20px;letter-spacing:.02em;
  }
  .usp-list{list-style:none;padding:0;margin:14px 0;}
  .usp-list li{font-size:12.5px;padding:7px 0 7px 22px;position:relative;color:var(--ink-soft);}
  .usp-list li::before{content:"✓";position:absolute;left:0;top:6px;color:var(--teal);font-weight:700;font-size:11px;}

  .quick-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .quick-nums .qn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow-sm);}
  .quick-nums .qn .l{font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .quick-nums .qn .v{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:19px;margin-top:6px;color:var(--ink);}

  .backbtn{
    background:none;border:none;color:var(--ink-soft);font-size:12.5px;
    padding:12px 0 6px;cursor:pointer;font-family:'Inter';font-weight:600;
  }
  .backbtn:hover{color:var(--ink);}
</style>
</head>

let DATA = null;
let basket = {};

const mainArea = document.getElementById('mainArea');
const metaLine = document.getElementById('metaLine');
const stickyBar = document.getElementById('stickyBar');

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    DATA = res && res.value ? JSON.parse(res.value) : SAMPLE_DATA;
  }catch(e){ DATA = SAMPLE_DATA; }
  if(DATA.cdPercent===undefined) DATA.cdPercent=5;
  if(DATA.gstPercent===undefined) DATA.gstPercent=18;
  renderMeta(); render();
}
async function saveData(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true); return true; }catch(e){ return false; }
}
function renderMeta(){ metaLine.textContent = `Trade Sales Scheme — ${DATA.month} · CD ${DATA.cdPercent}% · GST ${DATA.gstPercent}%`; }
function money(n){ return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:0}); }
function findSlab(slabs, qty){ if(!slabs||!slabs.length) return null; return slabs.find(s=>qty>=s.min && qty<=s.max) || null; }
function inWindow(startStr,endStr){
  const s=new Date(startStr+'T00:00:00'), e=new Date(endStr+'T23:59:59');
  return TODAY>=s && TODAY<=e;
}

// ---- per-product computation ----
// DPL -> Inbill -> GSR(=DPL-Inbill) -> CD -> Net Landing after Tax(+GST) -> Product/Vol CN(on GSR) -> Scheme Loading -> Scheme Landing
function computeProduct(p, qty){
  const q = qty||0;
  const dplValue = p.basePrice*q;
  const inbill = dplValue*(p.inbillPercent||0)/100;
  const gsrValue = dplValue - inbill;
  const cd = gsrValue*(DATA.cdPercent/100);
  const netAfterTaxValue = (gsrValue - cd) * (1+DATA.gstPercent/100);
  const netRatePerUnit = q>0 ? netAfterTaxValue/q : (p.basePrice*(1-p.inbillPercent/100))*(1-DATA.cdPercent/100)*(1+DATA.gstPercent/100);

  let volumeBenefit = 0; // Product/Volume CN, computed on GSR value
  (p.volumeRules||[]).forEach(rule=>{
    if(rule.type==='percent_slab'){
      const s = findSlab(rule.slabs,q);
      if(s) volumeBenefit += gsrValue*s.percent/100;
    }else if(rule.type==='flat_slab'){
      const s = findSlab(rule.slabs,q);
      if(s) volumeBenefit += s.amount;
    }else if(rule.type==='per_increment'){
      const from = rule.from||0;
      const extra = Math.max(0,q-from);
      const count = Math.floor(extra/rule.every);
      volumeBenefit += count*rule.amount;
    }
  });

  return {dplValue, inbill, gsrValue, cd, netAfterTaxValue, netRatePerUnit, volumeBenefit};
}

// ---- GSR-level computation (GSR = sum of DPL-Inbill across basket) ----
function computeGSRSchemes(gsrTotal, gsrEligibleRTS){
  let valueCN=0, valueLabel='';
  const fx = findSlab(DATA.valueCN.fixedSlabs, gsrTotal);
  const pc = findSlab(DATA.valueCN.percentSlabs, gsrTotal);
  if(pc){ valueCN = gsrTotal*pc.percent/100; valueLabel = pc.percent+'% of GSR'; }
  else if(fx){ valueCN = fx.amount; valueLabel = 'Fixed slab'; }

  let rts=0, rtsStatus='not applicable';
  if(DATA.riseToShine && DATA.riseToShine.active){
    const open = inWindow(DATA.riseToShine.start, DATA.riseToShine.end);
    rtsStatus = open ? 'open' : 'closed';
    if(open){ const s=findSlab(DATA.riseToShine.slabs, gsrEligibleRTS); rts = s?s.amount:0; }
  }

  let eb=0, ebWindowName=null, ebStatus='closed', ebPercent=0;
  const openWindows = DATA.earlyBird.windows.filter(w=>inWindow(w.start,w.end));
  if(openWindows.length){
    const w = openWindows[openWindows.length-1];
    ebWindowName=w.name; ebStatus='open';
    const s=findSlab(w.slabs, gsrTotal);
    if(s){ eb=gsrTotal*s.percent/100; ebPercent=s.percent; }
  }
  return {valueCN, valueLabel, rts, rtsStatus, eb, ebWindowName, ebStatus, ebPercent};
}

function basketArray(){
  return DATA.products.filter(p=>basket[p.id]>0).map(p=>({p, qty:basket[p.id], calc:computeProduct(p,basket[p.id])}));
}

function skuOptions(p){
  if(p.unit==='Kg') return [1,5,10,20];
  if(p.unit==='L') return [1,4,10,20];
  const pq = packQty(p.pack);
  return [pq || 1];
}

// Best-case scheme benefit if the dealer maxes out every applicable slab:
// top Product/Volume CN tier (evaluated at a very large qty so per-litre/flat add-ons
// converge to their steady-state rate too), plus the top Value CN % and the best
// Early Bird % available across all windows (regardless of whether that window is open today).
// In-Bill is a % of DPL while Product/Volume CN, Value CN and Early Bird are % of GSR
// (post-Inbill), so they're combined on a common DPL basis rather than just added together.
function maxSchemeBenefits(p, gsrPerUnit){
  const LARGE_QTY = 100000;
  const bigCalc = computeProduct(p, LARGE_QTY);
  const productPerUnit = bigCalc.volumeBenefit / LARGE_QTY;
  const productPct = gsrPerUnit>0 ? (productPerUnit/gsrPerUnit)*100 : 0;

  const valuePct = Math.max(0, ...DATA.valueCN.percentSlabs.map(s=>s.percent));
  const ebPct = Math.max(0, ...DATA.earlyBird.windows.flatMap(w=>w.slabs.map(s=>s.percent)));

  const inbillPct = p.inbillPercent||0;
  const gsrSumPct = productPct + valuePct + ebPct; // % of GSR
  const totalPerUnit = gsrPerUnit*gsrSumPct/100;    // ₹/unit, GSR-based benefits only
  // Combined %-of-DPL: Inbill's own share, plus the GSR-based share scaled down to a DPL basis.
  const totalPctOfDPL = inbillPct + (1-inbillPct/100)*gsrSumPct;
  return { inbillPct, productPct, valuePct, ebPct, totalPct: gsrSumPct, totalPctOfDPL, totalPerUnit };
}

function tierIcon(tier){
  return tier==='Emulsion' ? 'E' : tier==='Primer' ? 'P' : tier==='Waterproofing' ? 'W' : tier==='Enamel' ? 'N' : tier==='Wood Finish' ? 'F' : tier==='Tool' ? 'T' : 'C';
}
function tierColor(tier){
  const map = {
    'Emulsion':'var(--teal)', 'Primer':'var(--gold)', 'Waterproofing':'var(--purple)',
    'Enamel':'var(--orange)', 'Wood Finish':'var(--slate)', 'Tool':'var(--ink-soft)', 'Colorant':'var(--plum)'
  };
  return map[tier] || 'var(--ink-soft)';
}

function packQty(packStr){
  const m = (packStr||'').match(/([\d.]+)\s*(L|Kg)/i);
  return m ? parseFloat(m[1]) : null;
}

// Which pack size is the reference "base" for DPL and scheme figures:
// Emulsions, Primers and Waterproofing (Wall n Roof etc.) → the 20L pack.
// Enamels and everything else → the 1L pack.
const PACK_BASE_TIERS = ['Emulsion','Primer','Waterproofing'];
function baseQtyForProduct(p){
  if(PACK_BASE_TIERS.includes(p.tier)) return packQty(p.pack) || 20;
  return 1;
}

function dplDisplay(p, qtyOverride){
  const qty = qtyOverride || baseQtyForProduct(p);
  return { amount: p.basePrice*qty, label: qty+p.unit };
}

// Per-product SKU size selected in the Products list (display/quick-set only, separate from basket).
let listSkuQty = {};
function getListSkuQty(p){
  if(!listSkuQty[p.id]) listSkuQty[p.id] = basket[p.id] || baseQtyForProduct(p);
  return listSkuQty[p.id];
}

function renderStickyBar(){
  const items = basketArray();
  const gsr = items.reduce((a,i)=>a+i.calc.gsrValue,0);
  if(items.length===0){ stickyBar.style.display='none'; return; }
  stickyBar.style.display='flex';
  document.getElementById('sbGsr').textContent = money(gsr);
}

function renderProducts(){
  if(selectedProductId){ renderProductDetail(); return; }

  const cats={};
  DATA.products.forEach(p=>{(cats[p.category]=cats[p.category]||[]).push(p);});

  html += `<div id="listBody"></div>`;
  mainArea.innerHTML = html;

  function draw(filter){
    const f=(filter||'').trim().toLowerCase();

      const items = cats[cat].filter(p=>!f||p.name.toLowerCase().includes(f));

        const qty=basket[p.id]||0;
        const calc=computeProduct(p,qty);

        body += `<div class="pcard ${qty>0?'inbasket':''}">
          <div class="ptop">
            <div class="qp-icon" data-openid="${p.id}" style="cursor:pointer;background:${tierColor(p.tier)}14;color:${tierColor(p.tier)};font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:17px;">

            <span class="unit">${p.unit}</span>
            ${qty>0?`<span class="pmini">Net Landing after Tax<br>${money(calc.netAfterTaxValue)}</span>`:''}

          </div>
        </div>`;
      });
      body += `</div>`;
    });
    if(!body) body = `<div class="empty">No products match.</div>`;
    document.getElementById('listBody').innerHTML = body;
    document.querySelectorAll('[data-qid]').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const id=inp.dataset.qid; const val=parseFloat(e.target.value)||0;
        if(val>0) basket[id]=val; else delete basket[id];
        render();
        const el=document.querySelector(`[data-qid="${id}"]`);
        if(el){ el.focus(); try{ const v=el.value; el.setSelectionRange(v.length,v.length); }catch(err){} }
      });
    });

      sel.addEventListener('change', e=>{

function renderProductDetail(){
  const p = DATA.products.find(x=>x.id===selectedProductId);
  if(!p){ selectedProductId=null; render(); return; }

  if(selectedQty===null){
    const existing = basket[p.id];
    const def = existing || baseQtyForProduct(p);
    selectedQty = def;
  }
  const pq = selectedQty;
  const calc = computeProduct(p, pq);
  const loadingPerUnit = pq>0 ? calc.volumeBenefit/pq : 0;
  const schemeLandingPerUnit = calc.netRatePerUnit - loadingPerUnit;
  const schemeLandingPack = schemeLandingPerUnit*pq;
  const normalLandingPack = calc.netRatePerUnit*pq;

  const gsrPerUnit = p.basePrice*(1-p.inbillPercent/100);
  const maxb = maxSchemeBenefits(p, gsrPerUnit);
  const bestNetPerUnit = calc.netRatePerUnit - maxb.totalPerUnit;
  const bestNetPack = bestNetPerUnit*pq;
  const inBasket = basket[p.id]>0;

  mainArea.innerHTML = `

      <div class="qp-icon" style="width:72px;height:72px;background:${tierColor(p.tier)}14;color:${tierColor(p.tier)};font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:26px;">

function renderSummary(){
  const items = basketArray();
  if(!items.length){
    mainArea.innerHTML = `<div class="empty">Your basket is empty.<br>Go to <b>Products</b> and enter quantities to see the order summary.</div>`;
    return;
  }
  const gsrTotal = items.reduce((a,i)=>a+i.calc.gsrValue,0);
  const gsrRTS = items.filter(i=>!(DATA.riseToShine.excludeCategories||[]).includes(i.p.category)).reduce((a,i)=>a+i.calc.gsrValue,0);
  const productCNTotal = items.reduce((a,i)=>a+i.calc.volumeBenefit,0);
  const gsrSchemes = computeGSRSchemes(gsrTotal, gsrRTS);
  const gsrLumpTotal = gsrSchemes.valueCN + gsrSchemes.rts + gsrSchemes.eb;
  const dplTotal = items.reduce((a,i)=>a+i.calc.dplValue,0);
  const inbillTotal = items.reduce((a,i)=>a+i.calc.inbill,0);
  const cdTotal = items.reduce((a,i)=>a+i.calc.cd,0);
  const netAfterTaxTotal = items.reduce((a,i)=>a+i.calc.netAfterTaxValue,0);
  const grandSchemeBenefit = productCNTotal + gsrLumpTotal;
  const schemeLandingTotal = netAfterTaxTotal - grandSchemeBenefit;

  let lines = items.map(i=>{
    const share = gsrTotal>0 ? i.calc.gsrValue/gsrTotal : 0;
    const allocatedLump = share*gsrLumpTotal;
    const totalLoading = i.calc.volumeBenefit + allocatedLump;
    const loadingPerUnit = i.qty>0 ? totalLoading/i.qty : 0;
    const schemeLandingPerUnit = i.calc.netRatePerUnit - loadingPerUnit;
    return `<div class="line-item">
      <div class="top"><span>${i.p.name}</span><span>${i.qty} ${i.p.unit} <button type="button" class="btn btn-danger btn-sm" data-removeid2="${i.p.id}" style="margin-left:6px;">Remove</button></span></div>
      <div class="sub2">
        <span>DPL ${money(i.calc.dplValue)}</span><span>Inbill −${money(i.calc.inbill)}</span><span>GSR ${money(i.calc.gsrValue)}</span><br>
        <span>CD(${DATA.cdPercent}%) −${money(i.calc.cd)}</span><span>+GST(${DATA.gstPercent}%)</span><span>Prod/Vol CN ${money(i.calc.volumeBenefit)}</span><br>
        <span>Value CN+RTS+EB share ${money(allocatedLump)}</span>
      </div>
      <div class="figs"><span class="lab">Net Landing ${money(i.calc.netRatePerUnit)}/${i.p.unit} − Loading ${money(loadingPerUnit)}/${i.p.unit}</span><b>= ${money(schemeLandingPerUnit)}/${i.p.unit}</b></div>
    </div>`;
  }).join('');

  const ebPill = gsrSchemes.ebStatus==='open' ? `<span class="pill open">${gsrSchemes.ebWindowName} OPEN</span>` : `<span class="pill closed">CLOSED</span>`;
  const rtsPill = gsrSchemes.rtsStatus==='open' ? `<span class="pill open">OPEN</span>` : `<span class="pill closed">${gsrSchemes.rtsStatus==='not applicable'?'N/A':'CLOSED'}</span>`;

  mainArea.innerHTML = `
    <h3 style="margin:4px 0 8px;">Scheme Landing per SKU</h3>
    ${lines}

    <h3 style="margin:18px 0 4px;">Basket-level (GSR) benefits</h3>
    <div class="breakdown-row"><div class="l"><b>Value CN</b>${gsrSchemes.valueLabel||'—'}</div><div class="r">${money(gsrSchemes.valueCN)}</div></div>
    <div class="breakdown-row"><div class="l"><b>Rise to Shine ${rtsPill}</b>1–6 Jul, excl. Enamel &amp; Distemper</div><div class="r">${money(gsrSchemes.rts)}</div></div>
    <div class="breakdown-row"><div class="l"><b>Early Bird ${ebPill}</b>${gsrSchemes.ebWindowName?gsrSchemes.ebWindowName+' · '+gsrSchemes.ebPercent+'% of GSR':'No window currently open'}</div><div class="r">${money(gsrSchemes.eb)}</div></div>

    <div class="grand">
      <div class="row"><span>Total DPL value</span><b>${money(dplTotal)}</b></div>
      <div class="row"><span>− Inbill discount</span><b>${money(inbillTotal)}</b></div>
      <div class="row"><span>= GSR</span><b>${money(gsrTotal)}</b></div>
      <div class="row"><span>− Cash Discount (${DATA.cdPercent}%)</span><b>${money(cdTotal)}</b></div>
      <div class="row"><span>+ GST (${DATA.gstPercent}%)</span><b>Net Landing after Tax: ${money(netAfterTaxTotal)}</b></div>
      <div class="row"><span>− Product/Vol CN + Value CN + RTS + EB</span><b>${money(grandSchemeBenefit)}</b></div>
      <div class="final"><span class="l">Scheme Landing (final)</span><span class="v">${money(schemeLandingTotal)}</span></div>
    </div>
  `;
  document.querySelectorAll('[data-removeid2]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      delete basket[btn.dataset.removeid2];
      render();
    });
  });
}

function gsrRow(listId,i,s,valKey){
  return `<div class="slabrow">
    <input class="w" type="number" data-list="${listId}" data-i="${i}" data-k="min" value="${s.min}" placeholder="min"/>
    <input class="w" type="number" data-list="${listId}" data-i="${i}" data-k="max" value="${s.max}" placeholder="max"/>
    <input class="w" type="number" data-list="${listId}" data-i="${i}" data-k="${valKey}" value="${s[valKey]}" placeholder="${valKey}"/>
    <button class="btn btn-danger btn-sm" data-dellist="${listId}" data-i="${i}" type="button">✕</button>
  </div>`;
}
function bindGsrList(listId, arr, valKey, redraw){
  document.querySelectorAll(`[data-list="${listId}"]`).forEach(inp=>{
    inp.oninput=()=>{ const i=+inp.dataset.i, k=inp.dataset.k; arr[i][k]=parseFloat(inp.value)||0; };
  });
  document.querySelectorAll(`[data-add="${listId}"]`).forEach(b=>{
    b.onclick=()=>{ const row={min:0,max:0}; row[valKey]=0; arr.push(row); redraw(); };
  });
  document.querySelectorAll(`[data-dellist="${listId}"]`).forEach(b=>{
    b.onclick=()=>{ arr.splice(+b.dataset.i,1); redraw(); };
  });
}

function productBlock(p,i){
  return `<details class="admin-block">
    <summary>${p.name||'Unnamed'} <button class="btn btn-danger btn-sm" data-delp="${i}" type="button">Delete</button></summary>
    <div class="row2" style="margin-top:9px;">
      <div class="field"><label>Name</label><input data-pf="name" data-i="${i}" value="${p.name}"/></div>
      <div class="field"><label>Category</label><input data-pf="category" data-i="${i}" value="${p.category}"/></div>
    </div>
    <div class="row3">
      <div class="field"><label>Pack ref</label><input data-pf="pack" data-i="${i}" value="${p.pack}"/></div>
      <div class="field"><label>Unit</label><input data-pf="unit" data-i="${i}" value="${p.unit}"/></div>
      <div class="field"><label>DPL ₹/unit</label><input type="number" data-pf="basePrice" data-i="${i}" value="${p.basePrice}"/></div>
    </div>

    <div data-rulewrap="${i}">${(p.volumeRules||[]).map((r,ri)=>ruleBlock(i,ri,r)).join('')}</div>
    <button class="btn btn-ghost btn-sm" data-addrule="${i}" type="button">+ Add rule</button>
  </details>`;

function ruleBlock(i,ri,r){
  const typeSel = `<select data-ruletype="${i}-${ri}">
    <option value="percent_slab" ${r.type==='percent_slab'?'selected':''}>% of GSR, by qty slab</option>
    <option value="flat_slab" ${r.type==='flat_slab'?'selected':''}>Flat ₹, by qty slab</option>
    <option value="per_increment" ${r.type==='per_increment'?'selected':''}>Every N units → fixed ₹</option>
  </select>`;
  let body='';
  if(r.type==='per_increment'){
    body = `<div class="row3" style="margin-top:6px;">
      <input type="number" data-inc="${i}-${ri}-every" value="${r.every}" placeholder="every N units"/>
      <input type="number" data-inc="${i}-${ri}-amount" value="${r.amount}" placeholder="₹ amount"/>
      <input type="number" data-inc="${i}-${ri}-from" value="${r.from||0}" placeholder="starting from qty"/>
    </div>`;
  }else{
    const valKey = r.type==='percent_slab' ? 'percent' : 'amount';
    body = `<div data-slabwrap="${i}-${ri}" style="margin-top:6px;">${(r.slabs||[]).map((s,si)=>gsrRow(`rule-${i}-${ri}`,si,s,valKey)).join('')}</div>
      <button class="btn btn-ghost btn-sm" data-addruleslab="${i}-${ri}" type="button">+ Add slab</button>`;
  }
  return `<div style="border:1px dashed var(--line);border-radius:9px;padding:8px;margin-bottom:8px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
      ${typeSel}
      <button class="btn btn-danger btn-sm" data-delrule="${i}-${ri}" type="button">✕</button>
    </div>
    ${body}
  </div>`;
}

function bindProductBlock(p,i,redraw){
  document.querySelector(`[data-delp="${i}"]`).onclick=()=>{ DATA.products.splice(i,1); redraw(); };
  document.querySelectorAll(`[data-pf][data-i="${i}"]`).forEach(inp=>{
    inp.oninput=()=>{
      const f=inp.dataset.pf;
      if(f==='basePrice'||f==='inbillPercent') p[f]=parseFloat(inp.value)||0;
      else p[f]=inp.value;
    };
  });
  document.querySelector(`[data-addrule="${i}"]`).onclick=()=>{
    p.volumeRules=p.volumeRules||[];
    p.volumeRules.push({type:'percent_slab',slabs:[{min:0,max:999999,percent:0}]});
    redraw();
  };
  (p.volumeRules||[]).forEach((r,ri)=>{
    const typeEl=document.querySelector(`[data-ruletype="${i}-${ri}"]`);
    if(typeEl) typeEl.onchange=()=>{
      const t=typeEl.value; r.type=t;
      if(t==='per_increment'){ r.every=50; r.amount=0; r.from=0; delete r.slabs; }
      else{ r.slabs=[{min:0,max:999999,percent:0,amount:0}]; delete r.every; delete r.amount; delete r.from; }
      redraw();
    };
    const delBtn=document.querySelector(`[data-delrule="${i}-${ri}"]`);
    if(delBtn) delBtn.onclick=()=>{ p.volumeRules.splice(ri,1); redraw(); };
    if(r.type==='per_increment'){
      ['every','amount','from'].forEach(k=>{
        const el=document.querySelector(`[data-inc="${i}-${ri}-${k}"]`);
        if(el) el.oninput=()=>{ r[k]=parseFloat(el.value)||0; };
      });
    }else{
      const valKey=r.type==='percent_slab'?'percent':'amount';
      document.querySelectorAll(`[data-list="rule-${i}-${ri}"]`).forEach(inp=>{
        inp.oninput=()=>{ const si=+inp.dataset.i, k=inp.dataset.k; r.slabs[si][k]=parseFloat(inp.value)||0; };
      });
      const addBtn=document.querySelector(`[data-addruleslab="${i}-${ri}"]`);
      if(addBtn) addBtn.onclick=()=>{ const row={min:0,max:0}; row[valKey]=0; r.slabs.push(row); redraw(); };
      document.querySelectorAll(`[data-dellist="rule-${i}-${ri}"]`).forEach(b=>{
        b.onclick=()=>{ r.slabs.splice(+b.dataset.i,1); redraw(); };
      });
    }
  });
}

loadData();
</script>
</body>
</html>
